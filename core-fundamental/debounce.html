<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asynchronous Code Execution in JavaScript</title>
  </head>
  <body>
    <h1>Asynchronous Code Execution</h1>

    <div class="container">
      <input
        type="search"
        id="searchInput"
        value=""
        placeholder="Enter search query"
        autocomplete="off"
      />
    </div>

    <script>
      let counter = 1;
      let search = document.getElementById("searchInput");

      async function searchQueryAPI(query) {
        try {
          console.log(`${query} - ${counter++}`);
          const response = await fetch(`http://api.example.com/search?query=${query}`);
          const data = await response.json();
          console.log(data);
        } catch (err) {
          console.log(err);
        }
      }

      function debounce(func, delay) {
        let timer;
        return function (...args) {
          if (timer) clearTimeout(timer);
          timer = setTimeout(() => {
            func(...args);
          }, delay);
        };
      }

      let optimizedFunc = debounce(searchQueryAPI, 1000);
      search.addEventListener("keyup", (e) => optimizedFunc(e.target.value));
    </script>
  </body>
</html>
