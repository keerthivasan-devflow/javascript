<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Document</title>
  </head>
  <body>
    <input type="text" name="username" id="username" autocomplete="off" />
  </body>
  <script>
    let searchElement = document.querySelector("input");
    let p = document.createElement("p");
    document.body.append(p);
    p.textContent = "Default: ";

    function defaultTextOutcome(input) {
      p.textContent = "Default: " + input;
    }

    // Debouncing START
    let p2 = document.createElement("p");
    document.body.append(p2);
    p2.textContent = "Debounce: ";

    function debounceTextOutcome(input) {
      p2.textContent = "Debounce: " + input;
    }

    function debounce(func, delay) {
      let timeout;
      return function (...args) {
        if (timeout) clearTimeout(timeout);
        timeout = setTimeout(() => func(...args), delay);
      };
    }

    let debounceResult = debounce(debounceTextOutcome, 3000);
    // Debouncing END

    let p3 = document.createElement("p");
    document.body.appendChild(p3);
    p3.textContent = "Throttle: ";

    function throttleTextOutcome(input) {
      p3.textContent = "Throttle: " + input;
    }

    function throttle(func, delay) {
      let flag = true;
      return function (...arguments) {
        if (flag) {
          func(...arguments);
          flag = false;
          setTimeout(() => {
            flag = true;
          }, delay);
        }
      };
    }

    let throttleResult = throttle(throttleTextOutcome, 3000);

    searchElement.addEventListener("keyup", (event) => {
      console.count("Event is triggered!");
      defaultTextOutcome(event.target.value);
      debounceResult(event.target.value);
      throttleResult(event.target.value);
    });
  </script>
</html>
