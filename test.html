<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test File</title>
  </head>
  <style>
    .container {
      position: relative;
      border: solid red 3px;
      width: 600px;
      height: 500px;
    }
    .box {
      border: solid 2px black;
      width: 100px;
      height: 100px;
      position: absolute;
    }
    .box-1 {
      top: 0;
      left: 0;
    }
    .box-2 {
      top: 0;
      right: 0;
    }
    .box-3 {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    .box-4 {
      bottom: 0;
      left: 0;
    }
    .box-5 {
      bottom: 0;
      right: 0;
    }
  </style>
  <body>
    <input
      type="text"
      value=""
      id="queryInput"
      placeholder="Enter your query"
    />

    <div class="container">
      <div class="box box-1">Box - 1</div>
      <div class="box box-2">Box - 2</div>
      <div class="box box-3">Box - 3</div>
      <div class="box box-4">Box - 4</div>
      <div class="box box-5">Box - 5</div>
    </div>
    <script>
      let input = document.getElementById("queryInput");
      let count = 1;

      function outcome(data) {
        console.log("It's executing...", data);
      }

      //   function debounce(func, delay) {
      //     let timer;
      //     return function (...args) {
      //       if (timer) clearTimeout(timer);
      //       timer = setTimeout(() => func(args), delay);
      //     };
      //   }

      function throttle(func, limit) {
        let flag = true;
        return function () {
          if (flag) {
            func();
            flag = false;
            setTimeout(() => {
              flag = true;
            }, limit);
          }
        };
      }

      //   let optimizedDebounce = debounce(outcome, 3000);
      //   input.addEventListener("keyup", (e) => optimizedDebounce(e.target.value));
      let optimizedthrottle = throttle(outcome, 3000);
      input.addEventListener("keyup", (e) => optimizedthrottle(e.target.value));
    </script>
  </body>
</html>
