<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO: add / remove / removeall</title>
  </head>
  <body>
    <h1 class="header">Simple TODO - Add / Delete Operation</h1>
    <div class="container">
      <form id="text-form" class="form-container" method="get">
        <label for="input-field">Enter Value : </label>
        <input type="text" id="input-field" class="text-field" name="input-field" value="">
        <button type="button" class="add-btn">Add an element</button>
        <button type="button" class="remove-btn">Remove an element</button>
        <button type="button" class="remove-all-btn">Remove all elements</button>
      </form>
      <ol class="list-of-names"></ol>
    </div>
  </body>
</html>

<script>
  // Getting the input element to manipulate
  let InputElement = document.getElementById("input-field");
  let BreakLineElement = document.createElement("br");
  let BreakLine = (position, element) => {
    InputElement.insertAdjacentElement(position, element.cloneNode(true));
  };

  BreakLine("afterEnd", BreakLineElement);
  BreakLine("afterEnd", BreakLineElement);

  let AddButton = document.querySelector(".add-btn")
  let RemoveButton = document.querySelector(".remove-btn")
  let RemoveAllButton = document.querySelector(".remove-all-btn")
  let ol = document.querySelector(".list-of-names")

  AddButton.addEventListener("click", (event) => {
    let li = document.createElement("li");
    li.textContent = InputElement.value;
    ol.appendChild(li);
    InputElement.value = "";
  });

  RemoveButton.addEventListener("click", () => {
    let Elements = document.getElementsByClassName("list-of-names")[0];
    if (Elements.children.length > 0) {
      Elements.removeChild(Elements.children[0]);
    }
  });

  RemoveAllButton.addEventListener("click", () => {
    let Elements = document.getElementsByClassName("list-of-names")[0];
    Elements.style.border ='none'
    Elements.innerHTML = "";
  });
</script>
