<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        margin: 0;
        padding: 0;
      }
      form {
        max-width: 400px;
        margin: 20px auto;
        padding: 20px;
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        text-align: center;
        color: #333;
      }
      label {
        display: inline;
        font-weight: bold;
      }
      input[type="text"],
      input[type="password"],
      input[type="email"],
      select,
      textarea {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      input[type="radio"],
      input[type="checkbox"] {
        display: inline-block;
        margin-right: 5px;
      }
      input[type="submit"] {
        width: 100%;
        padding: 10px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
      input[type="submit"]:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h2>Registration Form</h2>
    <form method="get" name="regform">
      <label for="name">Name:</label>
      <input type="text" id="name" name="username" value="Keerthi" />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter your strong password now"
      />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" />

      <div class="gender-block" style="margin-bottom: 15px">
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
      </div>

      <div class="age-block" style="margin-bottom: 15px">
        <label for="age">Age:</label>
        <select id="age" name="age">
          <option value="">Select</option>
          <option value="18-25">18-25</option>
          <option value="26-35">26-35</option>
          <option value="36-50">36-50</option>
          <option value="51+">51+ nice</option>
        </select>
      </div>

      <div class="interests-section" style="margin-bottom: 15px">
        <label for="interests">Interests:</label>
        <input type="checkbox" id="sports" name="interests" value="sports" />
        <label for="sports">Sports</label>
        <input type="checkbox" id="music" name="interests" value="music" />
        <label for="music">Music</label>
        <input type="checkbox" id="movies" name="interests" value="movies" />
        <label for="movies">Movies</label>
      </div>
      <label for="comments">Comments:</label>
      <textarea id="comments" name="comments" rows="4" cols="50"></textarea>

      <input type="submit" value="Submit" />
    </form>
  </body>
</html>

    console.log(selectBoxELement.options[selectBoxELement.selectedIndex].text)
  });

  let SelectElement = document.createElement("select");
  SelectElement.setAttribute("id", "interessts");
  let Music = new Option("music", "music");
  let Movies = new Option("movies", "movies");
  let Singers = new Option("singers", "singers");
  let BigBoss = new Option("tv-shows", "tv-shows");

  SelectElement.add(Music, 0);
  SelectElement.add(Movies, 1);

</script>
